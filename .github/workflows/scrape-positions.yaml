on:
  schedule:
    # Day hours (6 AM - 11 PM EDT = 10:00 - 03:00 UTC): every 15 minutes
    - cron: "*/15 10-23 * * *"   # 10:00-23:59 UTC (6 AM - 7:59 PM EDT)
    - cron: "*/15 0-3 * * *"     # 00:00-03:59 UTC (8 PM - 11:59 PM EDT)
    # Overnight (11 PM - 6 AM EDT = 03:00 - 10:00 UTC): every 30 minutes
    - cron: "0,30 4-9 * * *"     # 04:00-09:59 UTC (midnight - 5:59 AM EDT)
  workflow_dispatch:  # allow manual trigger for testing

name: Scrape Positions (open data)
jobs:
  scrape-positions:
    name: Scrape Positions
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install overfly-positions
        run: pip install .

      - name: Scrape position data
        run: python -m overfly_positions.cli

      # Public repo, unmetered Actions minutes (ADR-0035) — commits to
      # itself via the built-in GITHUB_TOKEN. No cross-repo PAT, no stored
      # secret in this workflow at all.
      - name: Commit position snapshots
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: position snapshot"
          add: "./logs/*"
          force: true
          pull: "--rebase --autostash"
          default_author: github_actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
